[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyescrow"
version = "0.1.0"
description = "AES-256 business key escrow library backed by SQLite"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.setuptools]
packages = ["keyescrow"]
